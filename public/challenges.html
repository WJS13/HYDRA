<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydra · Retos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="challenges">
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" onclick="navigateBack()">←</button>
      <h1>Retos</h1>
    </header>

    <main class="page-content">
      <section class="card">
        <h2>Retos activos</h2>
        <div id="challenge-list" class="stack"></div>
      </section>

      <!-- Formulario para crear nuevo reto -->
      <section class="card hidden" id="create-challenge-card">
        <h2>Crear nuevo reto</h2>
        <form id="new-challenge-form" class="form">
          <label class="form-field">
            <span>Objetivo del reto</span>
            <input type="text" id="challenge-title-input" placeholder="Ej. Ahorrar 50L este fin de semana" required>
          </label>
          <label class="form-field">
            <span>Plazo</span>
            <input type="text" id="challenge-deadline-input" placeholder="Ej. 3 días restantes" value="7 días restantes" required>
          </label>
          <label class="form-field">
            <span>Puntos de recompensa</span>
            <input type="number" id="challenge-points-input" value="100" min="20" max="500" required>
          </label>
          <div class="grid two-columns" style="margin-top: 8px;">
            <button type="submit" class="primary-button">Guardar reto</button>
            <button type="button" class="secondary-button" id="cancel-challenge-btn">Cancelar</button>
          </div>
        </form>
      </section>
    </main>

    <footer class="footer-actions">
      <button class="primary-button" id="new-challenge">Nuevo reto</button>
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="nav.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
