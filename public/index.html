<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydra - Bienvenido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body data-page="index">
  <div class="app-shell">
    <main class="auth-container full-screen" id="auth-container">
      <section class="card auth-card" id="login-section">
        <img src="assets/logo.png" alt="Hydra" class="auth-logo auth-logo--large">
        <h2 class="auth-title">Inicia sesi&oacute;n</h2>
        <form id="login-form" class="form">
          <label class="form-field">
            <span>Correo electr&oacute;nico</span>
            <input type="email" placeholder="usuario@correo.com" required>
          </label>
          <label class="form-field">
            <span>Contrase&ntilde;a</span>
            <input type="password" placeholder="********" required>
          </label>
          <p id="login-feedback" class="status-text small-text" style="display:none;"></p>
          <button type="submit" class="primary-button" id="login-btn">Entrar</button>
        </form>
        <p class="muted-text small-text">
          &iquest;Nuevo por aqu&iacute;?
          <button class="link-button" id="show-register">Crear cuenta</button>
        </p>
      </section>

      <section class="card auth-card hidden" id="register-section">
        <img src="assets/logo.png" alt="Hydra" class="auth-logo auth-logo--large">
        <h2 class="auth-title">Crear cuenta</h2>
        <form id="register-form" class="form">
          <label class="form-field">
            <span>Nombre completo</span>
            <input type="text" placeholder="Ana Torres" required>
          </label>
          <label class="form-field">
            <span>Correo electr&oacute;nico</span>
            <input type="email" placeholder="usuario@correo.com" required>
          </label>
          <label class="form-field">
            <span>Contrase&ntilde;a</span>
            <input type="password" placeholder="Crea una clave segura" required minlength="6">
          </label>
          <p id="register-feedback" class="status-text small-text" style="display:none;"></p>
          <button type="submit" class="primary-button" id="register-btn">Crear cuenta</button>
        </form>
        <p class="muted-text small-text">
          &iquest;Ya tienes cuenta?
          <button class="link-button" id="show-login">Inicia sesi&oacute;n</button>
        </p>
      </section>

      <section class="card auth-card hidden" id="post-auth-section">
        <img src="assets/logo.png" alt="Hydra" class="auth-logo auth-logo--large">
        <h2 class="auth-title">Continuar</h2>
        <div class="action-buttons">
          <button class="primary-button" id="go-pairing">Configurar mi HydraPod</button>
          <button class="secondary-button" id="go-join">Unirme a un grupo existente</button>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js" defer></script>
</body>

</html>
