<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydra · Unirme a un grupo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="join">
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" onclick="navigateBack()">←</button>
      <h1>Unirme a un grupo</h1>
    </header>

    <main class="page-content">
      <section class="card">
        <h2>Ingresa el código de invitación</h2>
        <p class="muted-text small-text">El anfitrión puede compartirlo desde la app.</p>
        <form id="join-form" class="form">
          <label class="form-field">
            <span>Código</span>
            <input type="text" placeholder="Ej. HYDRA-1234" maxlength="10" required>
          </label>
          <button type="submit" class="primary-button">Unirme</button>
        </form>
      </section>

      <section class="card">
        <h3>Grupo destacado</h3>
        <p id="group-highlight" class="muted-text">—</p>
      </section>
    </main>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
