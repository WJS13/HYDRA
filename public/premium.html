<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydra · Plan Premium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="premium">
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" onclick="navigateBack()">←</button>
      <h1>Hydra Premium</h1>
    </header>

    <main class="page-content">
      <section class="card">
        <h2>Coach IA y reportes avanzados</h2>
        <ul class="list">
          <li>Reportes mensuales detallados con IA.</li>
          <li>Alertas en tiempo real por consumo excesivo.</li>
          <li>Retos personalizados y recomendaciones familiares.</li>
          <li>Integración con asistentes de voz.</li>
        </ul>
      </section>

      <section class="card">
        <h3>Precio lanzamiento</h3>
        <p class="price-tag">S/ 19.90 / mes</p>
        <p class="muted-text small-text">Cancela cuando quieras.</p>
      </section>
    </main>

    <footer class="footer-actions">
      <button class="primary-button" id="subscribe-premium">Suscribirme</button>
    </footer>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
