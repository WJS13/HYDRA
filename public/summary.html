<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydra · Resumen de ducha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="summary">
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" onclick="navigateTo('dashboard.html')">←</button>
      <h1>Resumen</h1>
    </header>

    <main class="page-content">
      <section class="card">
        <h2>Resultados de la ducha</h2>
        <div class="summary-grid">
          <div>
            <p class="label">Litros usados</p>
            <h3 id="summary-liters">--</h3>
          </div>
          <div>
            <p class="label">Energía</p>
            <h3 id="summary-energy">--</h3>
          </div>
          <div>
            <p class="label">Costo estimado</p>
            <h3 id="summary-cost">--</h3>
          </div>
          <div>
            <p class="label">Puntos ganados</p>
            <h3 id="summary-points">--</h3>
          </div>
          <div>
            <p class="label">Duración</p>
            <h3 id="summary-duration">--</h3>
          </div>
          <div>
            <p class="label">Nueva meta diaria</p>
            <h3 id="summary-new-goal">--</h3>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Recomendaciones de Hydra Coach</h2>
        <ul class="recommendation-list" id="summary-recommendations"></ul>
        <p class="status-text" id="summary-status">Cargando sugerencias...</p>
      </section>
    </main>

    <footer class="footer-actions">
      <button class="primary-button" onclick="navigateTo('dashboard.html')">Volver al dashboard</button>
    </footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
